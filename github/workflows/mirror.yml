name: Mirror Cobalt Official Image

on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull official Cobalt
        run: docker pull ghcr.io/imputnet/cobalt:11

      - name: Tag Cobalt for Docker Hub
        run: docker tag ghcr.io/imputnet/cobalt:11 ${{ secrets.DOCKERHUB_USERNAME }}/cobalt:11

      - name: Push Cobalt to Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/cobalt:11
